name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: DeckControl-Windows.exe}
          - {os: macos-14,       asset: DeckControl-macOS-AppleSilicon.zip}
          - {os: macos-15-intel, asset: DeckControl-macOS-Intel.zip}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build_windows.bat
          copy dist\DeckControl.exe ${{ matrix.asset }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          ditto -c -k --keepParent dist/DeckControl.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.asset }}", path: "${{ matrix.asset }}"}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          name: "DeckControl ${{ github.ref_name }} (Windows + macOS)"
